name: trash_monitor
description: >-
  Aplikasi mobile untuk memantau dan mengendalikan sistem pemilah sampah
  otomatis berbasis IoT — SMA Negeri 1 Bandung.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Visualisasi data
  fl_chart: ^1.2.0

  # Format tanggal & angka (versi dipin oleh flutter_localizations)
  intl: any

  # Backend: Firebase Realtime Database
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0

  # Push notification lokal (peringatan kapasitas, koneksi, error)
  flutter_local_notifications: ^22.3.1

  # Menyimpan pengaturan pada mode simulasi
  shared_preferences: ^2.5.5

  # Ikon iOS yang dipakai beberapa widget adaptif Material
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
